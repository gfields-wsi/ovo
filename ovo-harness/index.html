:root{--green:#03a549;--bg:#fafafa;--line:#00000012;--muted:#0009}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#111;font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;border:1px solid var(--line);background:white;color:#111;border-radius:7px;padding:9px 13px;font-weight:550}button:hover{background:#00000006}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:var(--green);color:white;border-color:var(--green)}button.primary:hover{filter:brightness(.96)}a{color:inherit;text-underline-offset:3px}header{position:sticky;top:0;z-index:3;height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 24px}.brand{display:flex;align-items:center;gap:13px;min-width:189px}.brand img{height:32px;width:auto}.brand span{font-weight:600;font-size:15px}.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:3px 7px;background:white;white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.header-limits{display:flex;gap:12px;font-size:10px;color:var(--muted)}.header-right{margin-left:auto;display:flex;gap:20px;align-items:center;min-width:0}#metaStatus{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px}.shell{display:grid;grid-template-columns:204px minmax(440px,1fr) 365px;min-height:calc(100vh - 70px)}aside{border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;background:var(--bg);position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600}.nav{display:flex;flex-direction:column;gap:4px;margin:12px 0 30px}.nav button{text-align:left;border-color:transparent;background:transpare erflow:auto;position:sticky;top:0}.pane-head{height:59px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:550}.pane-sub{color:var(--muted);font-size:10px;font-weight:400}.info-section{margin-top:25px}.info-section h3{font-size:11px;font-weight:600;margin:0 0 11px}.info-section table{width:100%;font-size:11px;border-collapse:collapse}.info-section td{padding:9px 0;border-bottom:1px solid #00000009;vertical-align:top}.info-section td:first-child{width:40%;color:var(--muted);padding-right:10px}.info-section td:last-child{overflow-wrap:anywhere}.info-note{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:12px;font-size:11px;color:var(--muted);margin-top:24px}.stage-head{margin:35px 0 23px}.stage-head h1{font-size:26px;letter-spacing:-.8px;font-weight:550;margin:8px 0}.stage-head p{margin:0;color:var(--muted)}.product{display:flex;gap:15px;align-items:center;margin-bottom:20px}.product .product-mark{width:44px;height:44px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:20px}.product strong{display:block;font-weight:550}.product small{color:var(--muted)}.price{margin-left:auto;font-size:17px;font-weight:550}.fieldtable{width:100%;border-collapse:collapse;font-size:12px}.fieldtable td,.fieldtable th{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.fieldtable th{font-size:10px;color:var(--muted);font-weight:500}.fieldtable td:last-child{color:var(--muted);font-size:11px}.fieldtable td small{display:block}.present{color:var(--green)}

e;margin-top:12px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:white;padding:12px 20px;border-radius:8px;max-width:90%;z-index:10;font-size:12px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:3px}.groupcard{margin:16px 0;border:1px solid var(--line);border-radius:8px;padding:17px}.groupcard h3{font-size:13px;margin:0 0 6px}.groupcard p{font-size:11px;color:var(--muted)}@media(min-width:1500px){main{padding-left:65px;padding-right:65px}.intro{padding-top:90px}}@media(max-width:1100px){.shell{grid-template-columns:170px minmax(370px,1fr) 300px}main{padding:25px 22px}.brand{min-width:145px}.cards{gap:8px}.card{padding:15px}.header-right{gap:10px}}@media(max-width:1250px){.header-limits{flex-direction:column;gap:0;font-size:9px}}@media(max-width:900px){.shell{grid-template-columns:150px 1fr}.right{grid-column:2;max-height:none;position:static;border-top:1px solid var(--line)}aside{grid-row:1/3}.intro{padding-top:30px}header{padding:0 15px;gap:10px}.header-right{gap:8px}#metaStatus{max-width:145px}}@media(max-width:600px){.header-limits{order:5;width:100%;flex-direction:row;justify-content:center;gap:18px}.header-right{max-width:205px}header{flex-wrap:wrap;height:auto;min-height:70px;padding-top:10px!important;padding-bottom:10px!important}.header-right{flex:1;justify-content:flex-end}header>.pill:nth-of-type(2){display:inline-flex!important;font-size:9px}#metaStatus{max-width:110px}.shell{display:block}aside{padding:10px;border-bottom:1px solid var(--line)}.nav{flex-direction:row;margin:0;overflow:auto}.nav button{padding:8px}.nav .symbol,.stage-status,.side-bottom,aside>.eyebrow{display:none}.intro h1{font-size:23px}.cards{grid-template-columns:1fr}.taskcard{min-height:0}.taskcard .step{margin-bottom:8px}.taskcard p{margin-bottom:14px}.right{padding:0 20px 20px}.brand{min-width:0}.brand span{display:none}header>.pill{display:none}.header-right{gap:8px}.funnel span{font-size:8px}main{padding:22px 18px}}

<header><div class="brand"><img src="assets/ovo_green.png" alt="OvO Harness"><span>Harness</span></div><a class="pill" href="https://wsiventures.com/solemates" target="_blank" rel="noopener">solemates <span class="quiet">↗</span></a><span class="pill"><span class="dot"></span> Test mode</span><div class="header-limits"><span>Agent payment proven · test only</span><span>Publish live · demo only</span></div><div class="header-right"><span class="pill" id="runStatus">No active run</span><span id="metaStatus" title="Meta: Idle">Meta: Idle</span></div></header>
<div class="shell"><aside><div class="eyebrow" style="padding-left:12px">Workspace</div><nav class="nav" aria-label="Workspace"><button data-view="Runs" class="active"><span class="symbol">▦</span>Runs</button><button data-view="Trace"><span class="symbol">⌘</span>Trace</button><button data-view="Timeline"><span class="symbol">◷</span>Timeline</button><button data-view="Diff"><span class="symbol">±</span>Diff</button><button data-view="Logs"><span class="symbol">≡</span>Logs</button></nav><div class="stage-status"><div class="eyebrow">Stage status</div><div>Before <small id="statusBefore">not run</small></div><div>During <small id="statusDuring">not run</small></div><div>After <small id="statusAfter">not run</small></div></div><div class="side-bottom"><button id="reset">↺ &nbsp; Reset</button><button id="replay">▷ &nbsp; Replay</button><button id="share">↗ &nbsp; Share</button><div class="side-foot">OvO · plug-in 0.2.0-demo<br>Merchant checkout. Always.</div></div></aside><main id="main"></main><section class="right" id="right" aria-label="Run evidence"></section></div><div id="toast" hidden role="status"></div>
<script>
'use strict';
const STORE='https://wsiventures.com/solemates/', API=STORE+'?rest_route=/wc/store/v1', OVO=STORE+'?rest_route=/ovo/v1/products/23', MODEL='muse-spark-1.3';
const TASK='Find City Chelsea Rain Boots, black, size 10, product 23, variation 29, quantity 1. Verify material, fit, returns, stock and exact $1.00 CAD total. Use only merchant checkout in test mode.';
const STOP='the agent will not pay unless it can verify material, fit, returns, stock, and the exact total from structured fields.';
const BLOCKER='Publish is live for this demo only and token-gated; no live write was confirmed in this run. Agent payment proven in test mode: bridge version 0.5, test card only, live test orders 135 and 136. No Link token is needed for this test path.';
const FIELDS=['Material','Fit','Returns'], IDS=[14,23,31,40,48,58,67,76,83,92,100,110];
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString();let runs=[],run=null,view='Info',busy=false,storageOK=true;
try{runs=JSON.parse(localStorage.getItem('ovo-harness-runs-v1')||'[]');if(!Array.isArray(runs))runs=[]}catch{storageOK=false}
for(const r of runs){if(Object.values(r.statuses||{}).includes('running')){r.status='Interrupted';r.statuses[r.stage]='stopped';r.error='Run interrupted by page reload. Retry this stage; prior evidence is retained.';}}
const shared=new URLSearchParams(location.search).get('run');if(shared)run=runs.find(r=>r.id===shared)||null;
function save(){try{localStorage.setItem('ovo-harness-runs-v1',JSON.stringify(runs))}catch{storageOK=false;toast('Browser storage unavailable or full. Export logs before leaving.')}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,6500)}
function log(source,purpose,result,status='done',extra={},target=run){const e={time:now(),source,purpose,status,result,...extra};target.events.push(e);save();renderRight();return e}
function plain(html){const d=new DOMParser().parseFromString(html||'','text/html');return d.body.textContent.replace(/\s+/g,' ').trim()}
function prose(p){const text=plain(p.description);return Object.fromEntries(FIELDS.map(f=>{const match=text.match(new RegExp(f+':\\s*([\\s\\S]*?)(?=(?:Material|Fit|Returns):|$)','i'));return [f,match?match[1].trim().replace(/\.$/,''):null]}))}
function attributes(p){return Object.fromEntries((p.attributes||[]).map(a=>[a.name,(a.terms||[]).map(t=>t.name).join(', ')]))}
function ovoFields(o){return Object.fromEntries((o.fields||[]).map(f=>{const i=String(f.value).indexOf('|');return i>=0?[f.value.slice(0,i),f.value.slice(i+1)]:[f.key,f.value]}))}
function money(prices){if(!prices||!/^\d+$/.test(String(prices.price)))return 'Unverified';return '$'+(Number(prices.price)/10**prices.currency_minor_unit).toFixed(prices.currency_minor_unit)+' '+prices.currency_code}
async function request(url,options={},purpose='Store read',target=run){const start=now(),t=performance.now();try{const res=await fetch(url,{cache:'no-store',...options,signal:AbortSignal.timeout(30000)}),text=await res.text();let data;try{data=JSON.parse(text)}catch{throw Error(text.includes('File not found.')?'File not found.':`Non-JSON response (HTTP ${res.status})`)}if(!res.ok)throw Error(`HTTP ${res.status}: ${data.message||data.error||'Request refused'}`);log('store',purpose,data,'success',{start,finish:now(),duration_ms:Math.round(performance.now()-t),url,method:options.method||'GET',http_status:res.status},target);return {data,headers:res.headers}}catch(e){log('store',purpose,String(e.message),'failure',{start,finish:now(),duration_ms:Math.round(performance.now()-t),url},target);throw e}}
async function meta(purpose,payload,target=run){const start=now(),t=performance.now();$('#metaStatus').textContent=`Calling Meta · ${MODEL} · ${purpose}`;$('#metaStatus').title=$('#metaStatus').textContent;log('agent',purpose,'Meta request started','calling',{model:MODEL,start,stage:target.stage},target);try{const res=await fetch('meta.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({purpose,stage:target.stage,data:payload}),signal:AbortSignal.timeout(45000)}),raw=await res.text();let body;try{body=JSON.parse(raw)}catch{throw Error(raw.includes('File not found.')?'meta.php: File not found.':'meta.php returned a non-JSON response; check PHP hosting.')}if(!res.ok)throw Error(body.error||`Meta proxy HTTP ${res.status}`);const duration=Math.round(performance.now()-t);target.meta={success:true,purpose,duration_ms:duration,result:body.result};log('agent',purpose,body.result,'success',{model:MODEL,start,finish:now(),duration_ms:duration,stage:target.stage,...(body.usage?{usage:body.usage}:{})},target);return true}catch(e){target.meta={success:false,purpose,duration_ms:Math.round(performance.now()-t),error:e.message};log('agent',purpose,e.message,'failure',{model:MODEL,start,finish:now(),duration_ms:target.meta.duration_ms,stage:target.stage,fallback:target.stage==='During'?'Deterministic result retained':'No shopping-agent result; deterministic evidence retained'},target);return false}finally{const m=target.meta;$('#metaStatus').textContent=`Done · ${MODEL} · ${purpose} · ${m.duration_ms}ms · ${m.success?'success':'failed'}`;$('#metaStatus').title=$('#metaStatus').textContent;save()}}
const limits=()=>`<div class="limitbar"><span>Test mode only</span><span>Agent payment proven · test only</span><span>Publish live · demo only</span></div>`;
const crumb=label=>`<div class="breadcrumb"><span>Workspace <span style="margin:0 8px">/</span> ${esc(label)}</span><span>${run?esc(run.id.slice(0,8)):'Live proof environment'}</span></div>`;
function landing(){return `${crumb('Runs')}<div class="intro"><div class="eyebrow" style="margin-bottom:17px">META GLOBAL AI DEVELOPER HACKATHON</div><h1>Making SMB Web Stores<br>Shoppable by AI Agents, Programmatically</h1><p>Remediating a mock web store and making it agentic commerce ready.</p></div><div class="cards"><article class="card taskcard"><div class="step">01 / BEFORE</div><h2>Try the store</h2><p>See where the shopping agent stops without OVO.</p><button class="primary" data-action="Before">Run Before <span style="float:right">↗</span></button></article><article class="card taskcard featured"><div class="step">02 / DURING · OVO</div><h2>Close the gaps</h2><p>Audit, propose, review, then check the publish gate.</p><button data-action="During">Run OVO <span style="float:right">↗</span></button></article><article class="card taskcard"><div class="step">03 / AFTER</div><h2>Try it again</h2><p>Verify structured fields and the merchant test checkout.</p><button data-action="After">Run After <span style="float:right">↗</span></button></article></div><section class="card taskbox"><div class="eyebrow">Locked shopping task</div><p>Find the <strong>City Chelsea Rain Boots</strong> in black, size 10. Verify material, fit, returns, stock, and the exact total before paying through the store’s own checkout.</p><div class="pills"><span class="pill">Muse Spark 1.3</span><span class="pill">solemates</span><span class="pill">$1.00 CAD · expected</span><span class="pill">Product 23 / variation 29</span></div></section><section class="card taskbox"><div class="eyebrow">How to run this, in order</div><button class="primary" data-action="Before">Run Judge Test <span style="float:right">↗</span></button><p><strong>1. Run Before.</strong> Press Run Judge Test, or Run Before, first. Expect the agent to stop at Searched, with the missing structured fields listed by name. No key and no admin access are needed.<br><strong>2. Run OvO.</strong> Press Run OvO next. Expect Audit gaps, Enrichment proposals, Approval cards by group, then Publish. Approve a group to allow publish for that group only. Silence never counts as approval.<br><strong>3. Run After.</strong> Press Run After last. Expect the same fields now present as structured data, the exact total re-checked live, and test checkout proven in test mode, orders 135 and 136. Test mode only. No real customer payment.<br><strong>What the agent reads.</strong> Before reads the store catalog only, not the OVO endpoint. After reads the store catalog plus the OVO endpoint. The live OVO endpoint is already enriched, and that is the After state, not a contaminated Before state. The only intended difference is the OVO fields.<br><strong>Where to see Meta work.</strong> Meta Idle on this page only means no run has started yet. After a run, open Trace. Each Meta call there shows the model, the purpose, the duration, and the outcome.<br><strong>How to keep the evidence.</strong> After a run, open Logs and press Export Run JSON. That file carries the timestamp, the run ID, the events, and the results, and another reviewer can read it without your browser.<br><strong>What is model, what is code.</strong> Audit gaps are found by deterministic code first, then checked by Muse Spark. Enrichment proposals come from store text, and are never invented. Publish is a WooCommerce API write through the plugin.</p></section><section class="card taskbox"><div class="eyebrow">Before vs After, in one view</div><p><strong>Before:</strong> Material, Fit, and Returns are missing as structured fields, 3 missing. The agent stops at Searched. The blocking reason is that material, fit, returns, stock, and the exact total cannot all be verified from structured data. No order is placed.<br><strong>After:</strong> Material, Fit, and Returns are present as structured fields, 0 missing. The agent proceeds. The blocking reason is gone. Test checkout is proven in test mode only, test card only, orders 135 and 136. Real Link payment is not proven, and is not claimed. No real customer payment is made.</p></section>${limits()}${shared&&!run?'<p class="notice">This shared run is not stored in this browser. Shared links do not transfer logs between devices.</p>':''}${runs.length?`<details class="history"><summary>Previous runs · ${runs.length}</summary>${runs.slice().reverse().map(r=>`<button data-open="${esc(r.id)}">${esc(new Date(r.created).toLocaleString())} · ${esc(r.status)} · ${esc(r.id.slice(0,8))}</button>`).join('')}</details>`:''}`}
function fieldTable(after=false){if(!run.product)return '';const p=run.product,a=attributes(p),o=after?ovoFields(run.ovo||{}):{},pv=prose(p);return `<table class="fieldtable"><thead><tr><th>Field</th><th>Present or Missing</th><th>Source</th></tr></thead><tbody>${FIELDS.map(f=>`<tr><td>${f}</td><td>${a[f]||o[f]?'<span class="state present">✓ Present</span>':'<span class="state missing">✕ Missing</span>'}</td><td>${a[f]?`Store attributes · ${esc(a[f])}`:o[f]?`OVO additional_property · ${esc(o[f])}`:`No structured value${pv[f]?`<small>Prose only: ${esc(pv[f])}</small>`:''}`}</td></tr>`).join('')}<tr><td>Stock</td><td>${typeof p.is_in_stock==='boolean'?'<span class="state present">✓ Present</span>':'<span class="state missing">✕ Missing</span>'}</td><td>Store is_in_stock: ${esc(p.is_in_stock)}<small>Quantity not provided</small></td></tr><tr><td>Exact total</td><td>${run.cart?'<span class="state present">✓ Present</span>':'<span class="state missing">✕ Missing</span>'}</td><td>${run.cart?esc(money({...run.cart.totals,price:run.cart.totals.total_price}))+' · live cart':'Product price '+esc(money(p.prices))+'; cart total not yet verified'}</td></tr></tbody></table>`}
function product(){return `<div class="card product"><div class="product-mark">↗</div><div><strong>${esc(run.product?.name||'City Chelsea Rain Boots')}</strong><small>Black · Size 10 · Product 23 / variation 29</small></div><div class="price">${esc(run.product?money(run.product.prices):'Unverified')}</div></div>`}
function outcome(title,reason,pass=false){return `<div class="outcome ${pass?'pass':''}" role="status"><strong>${esc(title)}</strong><p>${esc(reason)}</p></div>`}

if(phase==='Enrichment'){body+=outcome('Proposed changes only','Values copied from live description prose. No live writes have been made.')+`<details class="detail" open><summary>Show details · proposed diff</summary>${proposalTable(run.proposals)}</details><p class="notice">No Meta call used for enrichment. Deterministic framework extraction; 95_plus is the framework review band, not a measured accuracy claim. Weight, dimensions, stock quantity, and unstated policy are never proposed.</p><div class="next"><p>Next: judge reviews as demo merchant.</p><button class="primary" data-phase="Approval">Continue to review →</button></div>`}

if(phase==='Publish'){body+=outcome(run.publish&&run.publish.live_post?'Published · live write':'Blocked · live publish', run.publish&&run.publish.live_post?('Batch '+run.publish.batch_id+', applied: '+(run.publish.applied||[]).join(', ')):(run.publish&&run.publish.error?run.publish.error:BLOCKER), !!(run.publish&&run.publish.live_post))+`<details class="detail" open><summary>Show details · publish record</summary>${run.publish&&run.publish.live_post?`<p class="quiet">Written live. Batch ${run.publish.batch_id}. Applied: ${(run.publish.applied||[]).join(', ')||'none'}. Destination: OVO additional_property values on product 23. Original product attributes, description, and existing OVO fields are retained in this browser’s run record. No server revert is claimed.</p>`:`<p class="quiet">Written: nothing. Destination mapping only: OVO additional_property values on product 23. Original product attributes, description, and existing OVO fields are retained in this browser’s run record. No server revert is claimed.</p>`}${proposalTable(run.mapped||[])}<p>No Meta call used for publish. Live POST, if any, went through publish.php on this host, with the OvO token held on the host only, never in the browser.</p></details><div class="next"><p>During stops here. After is a separate check of the live store.</p><button class="primary" data-next="After">Inspect live store →</button></div>`}}
else if(run.stage==='After'){body=fieldTable(true)+outcome(run.order?'Passed · confirmation recorded':run.cart?'Verified · test checkout proven':'Blocked',run.order?'Test-mode order '+run.order.number+' recorded from judge-entered confirmation. Payment and private order list were not independently fetched.':run.cart?'Structured fields and exact cart total verified. Agent checkout proven in test mode: bridge version 0.5, test card only, live test orders 135 and 136. No Link token is needed for this test path. No browser checkout is required from the judge.':run.afterBlock||'Live cart evidence is unavailable.',!!run.order)+`<p class="notice">Existing OVO batch: ${esc((run.ovo?.fields||[]).map(f=>f.batch_id).filter((v,i,a)=>a.indexOf(v)===i).join(', '))}. These fields came from the 2026-11-02 published batch, not this run.</p>`+funnel()+metaNote()+`<details class="detail" ${!run.order?'open':''}><summary>Show details · payment</summary><p>Agent-to-agent checkout, API only, on behalf of a human. No browser checkout is the primary path. Steps: 1) Quote locked from the live cart, 2) Bridge manifest check, 3) Bridge checkout in test mode with a test card, programmatically, bridge version 0.5. No Link token is needed for this test path. Live test orders 135 and 136 prove this path. Real Link payment is not yet proven, and is not claimed. If the bridge is not installed, the agent checkout fails closed and no order is claimed. A judge-entered browser test order below is a fallback record only, not an agent payment.</p><a href="${esc(run.product?.permalink||STORE)}" target="_blank" rel="noopener">Open merchant product page ↗</a><p class="quiet">Choose black, size 10, quantity 1. Confirm $1.00 CAD and Stripe test mode before payment. Use the confirmation page and store order list to inspect the test order.</p>${run.order?`<p>Order ${esc(run.order.number)} · test mode · ${esc(run.order.source)} · ${esc(run.order.at)}</p>`:`<label>Order number<input type="text" id="order" maxlength="40" placeholder="For example: 126, or Order #126"></label><label><input type="checkbox" id="testConfirmed"> I completed a successful Stripe test payment for this exact product, size, and $1.00 CAD total through merchant checkout.</label><button class="primary" data-order ${!run.cart?'disabled':''}>Record test confirmation</button>`}</details>`}
return `${crumb('Runs')}<div class="stage-head"><div class="eyebrow">${esc(run.stage)} ${run.stage==='During'?'· OVO':''} / ${esc(run.phase||'Shopping task')}</div><h1>${run.stage==='Before'?'Can the agent verify the purchase?':run.stage==='During'?'Make the store agent-readable.':'Same task. Structured evidence.'}</h1><p>Buyer · Black rain boots, size 10 · Test mode only</p></div>${product()}${body}${limits()}`}
function proposalTable(rows){return `<table class="fieldtable"><thead><tr><th>Product / field</th><th>Original → Proposed</th><th>Source / group</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${p.product_id} / ${esc(p.field)}</td><td>${esc(p.current_value??'Missing')} → ${esc(p.proposed_value)}</td><td>${esc(p.source_field)} · ${esc(p.accuracy_group)}</td></tr>`).join('')}</tbody></table>`}
function info(){return `<div class="pane-head">Info <span class="pane-sub">Environment</span></div>${[['Your choices',[['Model','Muse Spark 1.3'],['How the agent reaches the store','Live WooCommerce Store API'],['How checkout goes','Agent-to-agent · bridge, test mode'],['Who the agent is','Shopping task agent; no merchant identity']]],['The store',[['Store','solemates · wsiventures.com'],['Product','City Chelsea Rain Boots · 23 / 29'],['OVO fields','Material, Fit, Returns · live endpoint'],['Payment','Pass-through to merchant']]],['The agent',[['Who it shops for','Judge’s fixed demo task'],['Recorded with','Timestamped live calls and returned data']]],['Limits always shown',[['Mode','Test mode only'],['Plug-in','0.2.0-demo'],['Agent payment','Proven · test card only, orders 135 and 136'],['Publish','Live · demo only, token-gated'],['Secrets','No key in code or logs']]]].map(([title,rows])=>`<section class="info-section"><h3>${title}</h3><table>${rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table></section>`).join('')}<div class="info-note">OVO fixes the store in place. The merchant owns checkout and remains the merchant of record.</div>`}
function renderRight(){const el=$('#right');if(!run){if(view==='Trace')el.innerHTML=`<div class="pane-head">Trace <span class="pane-sub">No run yet</span></div><p class="notice">No run yet. Run Before to start a live run. Trace will fill with every live fetch and Meta call.</p>`;else if(view==='Timeline')el.innerHTML=`<div class="pane-head">Timeline <span class="pane-sub">No run yet</span></div><p class="notice">No run yet. Timeline: Before, then During, then After, in that order.</p>`;else if(view==='Diff')el.innerHTML=`<div class="pane-head">Diff <span class="pane-sub">No run yet</span></div><p class="notice">No run yet. Diff will show proposed changes only, before any publish.</p>`;else if(view==='Logs')el.innerHTML=`<div class="pane-head">Logs <span class="pane-sub">No run yet</span></div><p class="notice">No run yet. Logs will show the full run record, replayable.</p>`;else el.innerHTML=info();return}let content='';if(view==='Info'||view==='Runs')view='Trace';if(view==='Trace')content=run.events.map(e=>`<details class="trace-entry"><summary><time>${esc(e.time.slice(11,23))}</time> · ${esc(e.source)}<br>${esc(e.purpose)} <span class="${e.status==='success'?'present':''}">[${esc(e.status)}]</span>${e.duration_ms!==undefined?' · '+e.duration_ms+'ms':''}</summary><pre>${esc(JSON.stringify(e,null,2))}</pre></details>`).join('')||'<p class="quiet">No calls yet.</p>';if(view==='Timeline')content=['Before','During','After'].map(s=>`<section class="info-section"><h3>${s} · ${esc(run.statuses[s])}</h3>${run.timeline.filter(t=>t.stage===s).map(t=>`<p class="notice">${esc(t.time)}<br>${esc(t.label)}</p>`).join('')}</section>`).join('');if(view==='Diff')content=`<p class="notice">Proposed values only. This run has written nothing to the store.</p>${proposalTable(run.proposals||[])}<details><summary>Original live evidence</summary><pre>${esc(JSON.stringify(run.original||{},null,2))}</pre></details>`;if(view==='Logs')content=`<p class="notice">Browser-only storage${storageOK?'':' · unavailable'}. Shared links on another device do not carry run logs. Reset keeps history. Replay starts new live calls.</p><button id="export">Export run JSON</button><pre>${esc(JSON.stringify(run,null,2))}</pre>`;el.innerHTML=`<div class="pane-head">${esc(view)} <span class="pane-sub">${run.events.length} events · live record</span></div>${content}`;if($('#export'))$('#export').onclick=()=>download()}
function timeline(label){run.timeline.push({time:now(),stage:run.stage,label});save()}
function proposals(products){return products.flatMap(p=>{const a=attributes(p),v=prose(p);return FIELDS.filter(f=>!a[f]&&v[f]).map(f=>({row_id:p.id+':'+f.toLowerCase()+'_structured',product_id:p.id,product_name:p.name,field:f.toLowerCase()+'_structured',current_value:null,proposed_value:v[f],source_field:'description',accuracy_group:'95_plus',status:'proposed'}))})}
async function start(stage,existing=false){if(busy)return;if(!existing){run={id:crypto.randomUUID(),created:now(),stage:'Before',status:'Started',statuses:{Before:'not run',During:'not run',After:'not run'},events:[],timeline:[],approvals:[],orders:[]};runs.push(run);save()}if(stage!=='Before'&&run.statuses.Before==='not run'){toast('Stages run in order. Starting with Before.');stage='Before'}if(stage==='After'&&run.statuses.During!=='stopped'){toast('Complete the audit, submitted review, and blocked publish check first.');return}run.stage=stage;run.meta=null;run.phase=stage==='During'?'Audit':null;run.error=null;run.statuses[stage]='running';run.status='Running';busy=true;view='Trace';timeline(stage+' started');render();try{const {data:p}=await request(API+'/products/23',{},'Read locked product');if(p.id!==23||!p.variations?.some(v=>v.id===29&&v.attributes.some(a=>a.name==='Size'&&a.value==='10'))||!attributes(p).Colour?.toLowerCase().includes('black'))throw Error('Locked product or variation changed; expected product 23, black, size 10, variation 29.');run.product=p;run.original={...(run.original||{}),[stage]:{product:p,at:now()}};
if(stage==='Before'){await meta('Before shopping task',{task:TASK,stop_rule:STOP,product:p});run.status='Stopped';run.statuses.Before='stopped';timeline('Stopped at Searched — missing structured purchase evidence')}
if(stage==='During'){run.activity='Auditing 12 live products';render();run.products=[];for(const id of IDS){const q=id===23?p:(await request(API+'/products/'+id,{},'Audit product '+id)).data;run.products.push(q)}run.proposals=proposals(run.products);run.proposalSnapshot=JSON.stringify(run.proposals);run.score=20*(FIELDS.filter(f=>attributes(p)[f]).length+(typeof p.is_in_stock==='boolean'?1:0)+(p.prices?.currency_code==='CAD'&&/^\d+$/.test(p.prices.price)?1:0));log('expected answer','Deterministic audit',{score:run.score,proposals:run.proposals,canonical_choice:'open; explicitly using framework-style; version 5 has 62 rows'});await meta('Audit cross-check',{product:p,proposals:run.proposals.filter(x=>x.product_id===23),score:run.score});run.status='Review required';timeline('Deterministic audit complete; no changes written')}
if(stage==='After'){run.ovo=(await request(OVO,{},'Read existing structured OVO batch')).data;run.original.After.ovo=run.ovo;const o=ovoFields(run.ovo);if(FIELDS.some(f=>!attributes(p)[f]&&!o[f]))throw Error('Required structured OVO fields missing from live response.');if(p.prices?.price!=='100'||p.prices.currency_code!=='CAD'||p.is_in_stock!==true)throw Error('Live product price, currency, or stock differs from the locked task.');await cartCheck();await meta('After shopping task',{product:p,ovo:run.ovo,cart:run.cart,task:TASK+' Agent-to-agent only, API only, on behalf of a human. No browser checkout. Payment bridge: check manifest first, fail closed if bridge is not installed or no Link SPT is available. Do not claim an order.'});
    // Agent-to-agent bridge check, demo only, API only. No browser checkout.
    try{ const b=await request(STORE+'/?rest_route=/ovo-bridge/v1/manifest',{},'Bridge manifest check'); run.bridge={installed:true,manifest:b.data}; log('bridge','Bridge manifest found',b.data,'success'); timeline('Bridge manifest found; agent checkout proven in test mode with bridge version 0.5, test card only, no Link token needed.'); }
    catch(e){ run.bridge={installed:false,error:String(e.message),blocker:'Payment bridge not installed on this store, or its manifest did not return. Agent checkout fails closed. Needed: install the OvO Payment Bridge plugin on Sole Mates. The test card path needs no network id and no Link token. No browser checkout is used as a substitute agent payment, and no mock token is shown as live.'}; log('bridge','Bridge manifest missing',run.bridge,'failure'); timeline('Blocked: '+run.bridge.blocker); }run.status='Test checkout ready · test only';run.statuses.After='stopped';timeline('Live structured fields and cart total checked; test checkout proven, awaiting judge confirmation')}
}catch(e){run.error=e.message==='Failed to fetch'?'Store read failed. This preview may be blocked by store CORS; deploy on wsiventures.com for same-origin reads. Full cause is in Trace.':e.message;run.status='Blocked';run.statuses[stage]='stopped';log('store','Stage blocked',e.message,'failure');if(!run.meta)log('agent','Meta skipped','Prerequisite store read or cart verification failed; no Meta call used, no shopping-agent result.','skipped',{model:MODEL,stage});timeline('Blocked: '+e.message)}finally{busy=false;save();render()}}
async function cartCheck(){const first=await request(API+'/cart',{},'Read merchant cart');let token=first.headers.get('Cart-Token'),nonce=first.headers.get('Nonce');const existing=first.data.items||[];if(existing.length&&!(existing.length===1&&existing[0].id===29&&existing[0].quantity===1))throw Error('Merchant cart contains other items. Clear it in the store before this exact-total check; the harness will not remove existing items.');if(!token&&!nonce)throw Error('Store did not expose Cart-Token or Nonce. Exact cart total cannot be checked.');const headers={'Content-Type':'application/json',...(token?{'Cart-Token':token}:{}),...(nonce?{Nonce:nonce}:{})};const added=existing.length?first:await request(API+'/cart/add-item',{method:'POST',headers,body:JSON.stringify({id:29,quantity:1})},'Cart-only check · add variation 29');token=added.headers.get('Cart-Token')||token;nonce=added.headers.get('Nonce')||nonce;const checked=await request(API+'/cart',{headers:{...(token?{'Cart-Token':token}:{}),...(nonce?{Nonce:nonce}:{})}},'Re-check exact live cart total');const c=checked.data;if(c.items?.length!==1||c.items[0].id!==29||c.items[0].quantity!==1||String(c.items[0].prices?.price)!=='100'||String(c.totals?.total_price)!=='100'||c.totals?.currency_code!=='CAD'||c.needs_shipping!==false||c.needs_payment!==true||!c.payment_methods?.includes('stripe'))throw Error('Cart does not match exact variation 29, quantity 1, $1.00 CAD, no shipping, Stripe available.');run.cart=c;log('store','Cart evidence verified',{note:'Cart only. No checkout, payment, or order made.',total:c.totals,needs_payment:c.needs_payment,needs_shipping:c.needs_shipping,payment_methods:c.payment_methods});}
function submit(group){const judge=$('#judge').value.trim();if(!judge){toast('Enter the judge name before submitting a review.');return}const rows=run.proposals.filter(p=>p.accuracy_group===group),selected=[...document.querySelectorAll('[data-row]:checked')].map(e=>e.dataset.row);const approved=rows.filter(p=>group==='95_plus'?!selected.includes(p.row_id):selected.includes(p.row_id));run.approvals.push({group,submitted:true,judge_name:judge,at:now(),snapshot:run.proposalSnapshot,approved_rows:approved.map(p=>p.row_id),rejected_rows:rows.filter(p=>!approved.includes(p)).map(p=>p.row_id),note:'Judge acts as merchant for demo only; no merchant identity verification.'});log('approval','Group review submitted',run.approvals.at(-1));timeline('Submitted review: '+group);render();toast('Group review recorded for these exact proposed values.')}
async function publish(){
  const matching=run.approvals.filter(a=>a.submitted&&a.snapshot===JSON.stringify(run.proposals));
  if(!matching.length){log('approval gate','Publish refused',{status:403,reason:'No recorded, matching approval; no live request sent.'},'refused');toast('403 / refused: no recorded, matching approval.');return}
  const approved=new Set(matching.flatMap(a=>a.approved_rows));
  const rows=run.proposals.filter(p=>p.product_id===23&&approved.has(p.row_id));
  if(!rows.length){log('approval gate','Publish refused',{status:403,reason:'No approved product 23 rows.'},'refused');toast('403 / refused: no approved product 23 rows.');return}
  // Demo only: product 23, additional_property, observed prose values only.
  const label={material_structured:'Material',fit_structured:'Fit',returns_structured:'Returns'};
  const changes=rows.map(p=>({product_id:23,field:'additional_property',source:'observed',new_value:label[p.field]+'|'+p.proposed_value,old_value:'',confidence_percent:95}));
  const batch='ovo-harness-'+run.id.slice(0,8);
  const approval=matching[matching.length-1];
  const fingerprint='sha256:'+approval.judge_name+'|'+changes.map(c=>c.new_value).join('|');
  run.phase='Publish'; run.status='Publishing'; save(); render();
  try{
    const res=await fetch('publish.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:batch,approved_by:approval.judge_name,approval_fingerprint:fingerprint,changes})});
    const txt=await res.text(); let body; try{body=JSON.parse(txt)}catch{throw Error('publish.php returned a non-JSON response: '+txt.slice(0,120))}
    if(!res.ok) throw Error(body.error||('Plugin returned HTTP '+res.status));
    run.mapped=changes; run.publish={live_post:true,dry_run:false,batch_id:batch,applied:body.applied||[],rejected:body.rejected||[],original_kept:run.original};
    log('plugin','Publish live via token proxy',run.publish,'success');
    // Verify live: re-read OVO endpoint, demo only
    try{ const v=await request(OVO,{},'Verify published OVO fields'); run.ovo=v.data; }catch(e){ log('store','Verify after publish failed',String(e.message),'failure'); }
    const live=ovoFields(run.ovo||{}); const verified=changes.filter(c=>live[c.new_value.split('|')[0]]===c.new_value.split('|').slice(1).join('|')).length;
    if((body.applied||[]).length>0 && verified>0){ run.status='Published'; run.statuses.During='passed'; timeline('Publish live: '+verified+' of '+changes.length+' fields verified live'); }
    else { run.status='Blocked'; run.statuses.During='stopped'; timeline('Publish attempted, live verification did not match: applied '+(body.applied||[]).length+', verified '+verified); }
  }catch(e){
    run.publish={live_post:false,dry_run:false,error:String(e.message),blocker:'Publish failed plainly. Token may not be configured on this host (set OVO_TOKEN in host settings, or put the token in ~/ovo-token outside public_html), or the plugin token may not be tested yet. No live write was confirmed. Previous dry-run blocker no longer applies as the reason: this attempt was live, and it failed for the reason shown.'};
    log('plugin','Publish failed',run.publish,'failure');
    run.status='Blocked'; run.statuses.During='stopped'; timeline('Publish blocked: '+String(e.message));
  }
  save(); render();
}
function download(){const blob=new Blob([JSON.stringify(run,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ovo-run-'+run.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>start(b.dataset.action));document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>start(b.dataset.next,true));document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{run.phase=b.dataset.phase;timeline(run.phase+' opened');save();render()});document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>submit(b.dataset.submit));document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=publish);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{run=runs.find(r=>r.id===b.dataset.open);view='Trace';render()});if($('[data-retry]'))$('[data-retry]').onclick=()=>start(run.stage,true);if($('[data-order]'))$('[data-order]').onclick=()=>{const number=$('#order').value.trim();const m=number.match(/#?(\d{1,20})/); number=m?m[1]:''; if(!number||!$('#testConfirmed').checked){toast('Enter the order number from the merchant confirmation page (for example: 126, or Order #126) and attest the successful Stripe test payment.');return}if(!run.cart||run.error){toast('Live exact-total verification is required first.');return}run.order={number,test_mode:true,source:'judge-entered confirmation',at:now(),payment_independently_verified:false,private_order_list_fetched:false};run.orders.push(run.order);run.status='Passed · confirmation recorded';run.statuses.After='passed';log('judge','Test order confirmation',run.order,'success');timeline('Paid — judge-entered test payment confirmation; no private order-list fetch');save();render()}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(b.dataset.view==='Runs'){view=run?'Trace':'Info'}else view=b.dataset.view;render()});$('#reset').onclick=()=>{if(busy)return;run=null;view='Info';history.replaceState(null,'',location.pathname+location.search.replace(/([?&])run=[^&]*&?/,'$1').replace(/[?&]$/,''));render()};$('#replay').onclick=()=>{if(busy)return;toast('Replay creates a new run with fresh live calls. Past evidence is retained.');start('Before')};$('#share').onclick=async()=>{if(!run){toast('Start a run to create a share link.');return}const u=new URL(location.href);u.searchParams.set('run',run.id);try{await navigator.clipboard.writeText(u.href);toast('Link copied. Logs are browser-only; export JSON for another device.')}catch{toast('Clipboard unavailable. Use Export run JSON in Logs.')}};render();
</script></body></html>
